name: Docker CI/CD Pipeline - Inventory System

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Multi-Container (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout ma nguon tu GitHub
        uses: actions/checkout@v4

      - name: 2. Tao file .env tu .env.example cho moi truong CI
        run: |
          cat << 'EOF' > .env
          MYSQL_ROOT_PASSWORD=123456
          MYSQL_DATABASE=inventory_db
          DB_HOST=db
          DB_USER=root
          EOF

      - name: 3. Kiem tra cu phap compose.yaml
        run: docker compose config -q

      - name: 4. Build Docker Images (API & Frontend)
        run: docker compose build

      - name: 5. Khoi chay he thong Multi-container
        run: |
          docker compose up -d
          echo "Doi MySQL khoi tao va dat trang thai Healthy..."
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' inventory_db 2>/dev/null)" = "healthy" ]; then
              echo "MySQL da Healthy!"
              break
            fi
            sleep 2
          done
          sleep 3
          docker compose ps

      - name: 6. Chay Automated Test kiem tra Web va Database
        run: |
          curl -f -s http://localhost:8080 > /dev/null
          echo "✅ Frontend Web (Port 8080): ONLINE (200 OK)"
          docker exec inventory_db mysql -uroot -p123456 -e "USE inventory_db; SELECT COUNT(*) FROM products;"
          echo "✅ API & MySQL Database: CONNECTED & VERIFIED"

      - name: 7. Don dep container sau khi test
        if: always()
        run: docker compose down -v
